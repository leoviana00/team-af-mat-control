name: CI - Repository Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        run: |
          python -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --disable-pip-version-check yamllint==1.38.0

      - name: Validate YAML files
        run: |
          . .venv-ci/bin/activate
          yamllint -d relaxed .github

      - name: Validate Markdown files
        run: |
          npx --yes markdownlint-cli2@0.24.1 \
            "**/*.md" \
            "#node_modules"

      - name: Install Actionlint
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_ASSET="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

          curl -fsSL \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ASSET}"

          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check

          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Validate GitHub Actions workflows
        run: |
          ./actionlint -color .github/workflows/*.yml

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/${BASE_REF}...HEAD"
          elif [ "$EVENT_NAME" = "push" ] && \
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BEFORE_SHA" HEAD
          fi
